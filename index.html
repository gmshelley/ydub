<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y-Dub Fantasy Football</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Y-Dub Fantasy Football">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E9EDF1; --ink:#141B23;
    --muted:#414B55; --line:#D8DEE4; --line-strong:#BFC7D0;
    --accent:#1E47A0; --on-accent:#FFFFFF; --accent-soft:#E6EDF8;
    --win:#1C7C42; --loss:#B23A2C; --live:#D64545;
    --nfc:#1E47A0; --afc:#2C82C9; --afc-bright:#5AA9E6;
    --qb:#C0392E; --rb:#2E8B4F; --wr:#2E6FC8; --te:#D57A2B; --k:#6B4E9E; --def:#5A6B78;
    --brand:'Rajdhani',sans-serif; --body:'Rubik',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0B1015; --surface:#131A21; --surface-2:#1B242D; --ink:#EAF0F6;
    --muted:#B4C0CC; --line:#26313B; --line-strong:#3A4652;
    --accent:#5AA9E6; --on-accent:#08243B; --accent-soft:#15303F;
    --win:#43C27E; --loss:#E5695B; --live:#FF5A54;
    --nfc:#3E74C9; --afc:#5AA9E6; --afc-bright:#7CC0F0;
  }}
  :root[data-theme="dark"]{
    --bg:#0B1015; --surface:#131A21; --surface-2:#1B242D; --ink:#EAF0F6;
    --muted:#B4C0CC; --line:#26313B; --line-strong:#3A4652;
    --accent:#5AA9E6; --on-accent:#08243B; --accent-soft:#15303F;
    --win:#43C27E; --loss:#E5695B; --live:#FF5A54;
    --nfc:#3E74C9; --afc:#5AA9E6; --afc-bright:#7CC0F0;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  img{max-width:100%} button{font-family:inherit}
  .wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

  /* Header */
  header{display:flex;align-items:center;gap:12px;padding-block:16px 14px;border-bottom:2px solid var(--ink);margin-bottom:2px}
  .mark{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
  .logo{width:46px;height:46px;border-radius:50%;flex:none;background:#000}
  .wordmark{font-family:var(--brand);font-weight:700;font-size:32px;letter-spacing:.005em;line-height:.84;text-transform:uppercase}
  .wordmark b{color:var(--accent)}
  .tag{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
  .theme-btn{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{border-color:var(--line-strong)}

  #installBar{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:11px 12px;margin:12px 0 0;font-weight:600;font-size:14.5px}
  #installBar span{flex:1;min-width:0}
  #installBar #installBtn{background:#fff;color:#1E47A0;border:0;border-radius:8px;font-weight:700;padding:8px 16px;cursor:pointer;font-family:var(--brand);text-transform:uppercase;letter-spacing:.04em;font-size:15px;flex:none}
  #installBar #installX{background:none;border:0;color:var(--on-accent);font-size:16px;cursor:pointer;opacity:.85;flex:none;padding:0 2px}
  .updated{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:9px 2px 0}
  .updated .rdot{width:7px;height:7px;border-radius:50%;background:var(--win)}
  .updated button{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}

  /* League switch — flat toggle, active fills with league color */
  .leagues{display:flex;gap:8px;margin:12px 0 6px}
  .leagues button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;
    font-weight:600;font-size:15px;padding:11px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;
    line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leagues button .swatch{width:10px;height:10px;border-radius:50%;flex:none;background:var(--lg,var(--muted))}
  .leagues button[aria-selected="true"]{background:var(--lg,var(--accent));color:#fff;border-color:transparent;font-weight:700}
  .leagues button[aria-selected="true"] .swatch{background:rgba(255,255,255,.9)}

  /* View tabs — underline style, not pills */
  .view{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:10px 0 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .view::-webkit-scrollbar{display:none}
  .view button{flex:none}
  .view button{background:none;border:0;cursor:pointer;color:var(--muted);font-family:var(--brand);text-transform:uppercase;
    letter-spacing:.06em;font-size:17px;font-weight:600;padding:10px 0;position:relative}
  .view button[aria-selected="true"]{color:var(--ink)}
  .view button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}

  /* Section header — left aligned with rule */
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
  .sec h2{font-family:var(--brand);text-transform:uppercase;font-weight:700;font-size:21px;letter-spacing:.02em;margin:0;line-height:1}
  .state{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.12em;padding:3px 9px;border-radius:3px;font-weight:700}
  .state.live{background:color-mix(in srgb,var(--live) 16%,transparent);color:var(--live)}
  .state.final{color:var(--muted);border:1px solid var(--line)}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.livedot,.spin,.splashlogo{animation:none}}

  .badge{border-radius:7px;flex:none;position:relative;display:inline-grid;place-items:center;overflow:hidden;color:#fff;font-family:var(--brand);font-weight:700;background:var(--tc,#456)}
  .badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .badge .mono{font-size:.42em}

  /* Matchups — flat, hairline, no shadow */
  .matchups{display:flex;flex-direction:column;gap:10px}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;width:100%;text-align:left;color:inherit;cursor:pointer;padding:0}
  .mcard:hover{border-color:var(--line-strong)}
  .mcard.gotw{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
  .gotw-ribbon{background:var(--accent);color:#fff;font-family:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;text-align:center;padding:5px 8px}
  .team{display:flex;align-items:center;gap:12px;padding:13px 14px}
  .team .who{flex:1;min-width:0}
  .team .name{font-family:var(--brand);font-weight:600;font-size:21px;line-height:1.04;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .owner{font-size:15px;color:var(--muted);margin-top:3px}
  .team .score{font-family:var(--brand);font-weight:700;font-size:29px;line-height:1;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
  .team .proj{display:block;font-size:13.5px;color:var(--muted);text-align:right;margin-top:3px}
  .team.trail{color:var(--muted)}
  .team.trail .name{color:var(--muted)}
  .mid{display:flex;align-items:center;gap:10px;padding:0 14px 2px}
  .mid .wp{flex:1;height:5px;border-radius:0;overflow:hidden;display:flex;background:var(--surface-2)}
  .mid .vs{font-family:var(--brand);font-size:13px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .mid .pct{font-size:14px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
  .taphint{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:8px 14px;font-size:12px;letter-spacing:.04em;color:var(--accent);font-weight:700;border-top:1px solid var(--line)}

  /* Standings — clean table, hairlines */
  .board{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{font-family:var(--brand);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12.5px;color:var(--muted);text-align:right;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
  thead th.lft{text-align:left;padding-left:14px}
  tbody td{padding:11px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;text-align:right;font-size:16px;font-weight:600}
  tbody td.tm{text-align:left;padding-left:14px}
  .tmcell{display:flex;align-items:center;gap:11px}
  tbody tr:first-child td{border-top:0}
  .rank{font-family:var(--brand);font-weight:700;font-size:18px;color:var(--muted);width:22px;text-align:center}
  .tm .nm{font-family:var(--brand);font-weight:600;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm .ow{font-size:14px;color:var(--muted);font-weight:500}
  td .pf{color:var(--muted);font-weight:600}
  .strk{font-family:var(--brand);font-weight:700;font-size:14px}
  .strk.w{color:var(--win)} .strk.l{color:var(--loss)}
  tr.cut td{border-top:2px solid var(--ink)}
  .cutlabel td{padding:5px 14px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}

  /* Standings — scrollable stats table w/ sticky Rank+Team + Pink Speedo rail */
  .stwrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .srail{width:24px;flex:none;display:flex;flex-direction:column}
  .srail-safe{flex:none;background:var(--surface-2)}
  .srail-zone{flex:1;min-height:46px;background:#EC4899;display:grid;place-items:center;overflow:hidden}
  .srail-zone span{writing-mode:vertical-rl;color:#fff;font-family:var(--brand);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
  .sboard{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
  .stbl{width:100%;border-collapse:separate;border-spacing:0;min-width:596px}
  .stbl th{font-family:var(--brand);text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;text-align:right}
  .stbl th.lft{text-align:left}
  .stbl td{padding:11px 12px;border-top:1px solid var(--line);font-size:16px;font-weight:600;white-space:nowrap}
  .stbl tbody tr:first-child td{border-top:0}
  .stbl td.num,.stbl th.num{text-align:right;font-variant-numeric:tabular-nums}
  .stbl td.muted{color:var(--muted)}
  .stbl .c-team{max-width:236px}
  .stbl .rnk{font-family:var(--brand);font-weight:700;font-size:17px;color:var(--muted);min-width:18px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
  .stbl tbody tr{--rowbg:var(--surface)}
  .stbl tbody tr.danger{--rowbg:color-mix(in srgb,#EC4899 8%,var(--surface))}
  .stbl thead tr{--rowbg:var(--surface-2)}
  .stbl tr.danger td{background:var(--rowbg)}
  .stbl .stick{position:sticky;left:0;z-index:2;background:var(--rowbg);box-shadow:9px 0 10px -8px rgba(15,25,40,.22)}
  .stbl thead .stick{z-index:3}
  .stbl tr.cutline td{border-top:2px solid var(--ink)}
  .stbl .tmcell{display:flex;align-items:center;gap:11px;min-width:0}
  .stbl .tmtxt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
  .stbl .nm{font-family:var(--brand);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stbl .nm .spd{margin-left:4px}
  .stbl .ow{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stbl .strk.w{color:var(--win)} .stbl .strk.l{color:var(--loss)} .stbl .strk{font-family:var(--brand);font-weight:700}
  .scrollhint{text-align:center;font-size:11.5px;color:var(--muted);margin:7px 0 0;letter-spacing:.04em;text-transform:uppercase}
  .stbl .rnkwrap{display:flex;flex-direction:column;align-items:center;min-width:20px;flex:none}
  .mv{font-size:10px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
  .mv.up{color:var(--win)} .mv.dn{color:var(--loss)} .mv.fl{color:var(--line-strong)}
  .po{display:inline-block;font-family:var(--brand);font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:5px;vertical-align:1px;margin-left:2px}
  .po-in{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .po-cl{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
  .po-hunt{background:var(--surface-2);color:var(--muted)}
  .po-out{background:color-mix(in srgb,var(--loss) 14%,transparent);color:var(--loss)}
  .stbl .odds{color:#EC4899;font-weight:700}
  /* Weekly Awards */
  .awards{display:flex;flex-direction:column;gap:11px;margin-top:12px}
  .award{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
  .award.tap{cursor:pointer} .award.tap:active{background:var(--surface-2)}
  .aw-info{flex:1;min-width:0}
  .aw-title{font-family:var(--brand);text-transform:uppercase;letter-spacing:.04em;font-size:15.5px;color:var(--accent);font-weight:700;line-height:1.1}
  .aw-title .em{font-size:19px;margin-right:3px;vertical-align:-2px}
  .aw-team{font-family:var(--brand);font-weight:700;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .aw-sub{font-size:15px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .aw-go{color:var(--line-strong);font-size:24px;font-weight:700;flex:none}
  .aw-ph{color:var(--ink);font-size:15px;font-weight:500;padding:4px 0}
  .wknav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
  .wkbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .wkbtn:active{background:var(--surface-2)}
  .wkbtn:disabled{opacity:.32;cursor:default}
  .wklabel{font-family:var(--brand);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;min-width:150px;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px}
  .awlock{background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px;padding:30px 22px;text-align:center;margin-top:14px}
  .awlock-em{font-size:42px;line-height:1}
  .awlock-t{font-family:var(--brand);font-weight:700;font-size:21px;margin-top:12px}
  .awlock-s{font-size:15px;color:var(--ink);line-height:1.5;margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto}
  .awsub{text-align:center;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:2px 0 0}
  .lgchip{display:inline-block;font-family:var(--brand);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--c,var(--accent));padding:1px 6px;border-radius:5px;vertical-align:2px}
  .aw-face{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none}
  .aw-face.ph{display:flex;align-items:center;justify-content:center;font-family:var(--brand);font-weight:700;font-size:13px;color:var(--muted)}
  /* Weekly Recap */
  .recap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:12px}
  .recap-tag{font-family:var(--brand);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:700;color:var(--accent)}
  .recap-head{font-family:var(--brand);font-weight:700;font-size:25px;line-height:1.1;margin:7px 0 4px;text-transform:none;letter-spacing:0}
  .recap p{font-size:16px;line-height:1.62;margin:13px 0;color:var(--ink)}
  .recap p b{font-weight:700}
  .recap-foot{font-size:12.5px !important;color:var(--muted) !important;font-style:italic;border-top:1px solid var(--line);padding-top:12px;margin-top:16px !important;line-height:1.4 !important}

  /* (legacy) Standings rows + Pink Speedo Zone */
  .strow{display:grid;grid-template-columns:24px 1fr 58px 62px 46px;align-items:center;gap:10px;padding:11px 12px 11px 36px;border-top:1px solid var(--line)}
  .board > .strow:first-child{border-top:0}
  .strow.sthead{font-family:var(--brand);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding-block:9px}
  .strow .c-rk{font-family:var(--brand);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
  .strow.sthead .c-rk,.strow.sthead .c-rc,.strow.sthead .c-pf,.strow.sthead .c-sk{font-size:12.5px;font-weight:600}
  .strow .c-rc,.strow .c-pf,.strow .c-sk{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
  .strow .c-pf{color:var(--muted)}
  .strow .tmcell{display:flex;align-items:center;gap:11px;min-width:0}
  .strow .tmtxt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
  .strow .nm{font-family:var(--brand);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strow .ow{font-size:14px;color:var(--muted);font-weight:500}
  .spd{display:inline-block;width:17px;height:15px;vertical-align:-2px;margin-left:4px}
  .spdnote .spd{vertical-align:-3px;margin:0 2px 0 0;width:18px;height:16px}
  .strow.danger{background:color-mix(in srgb,#EC4899 8%,var(--surface))}
  .strow.cutline{border-top:2px solid var(--ink)}
  .speedozone{position:relative}
  .speedorail{position:absolute;left:5px;top:5px;bottom:5px;width:25px;background:#EC4899;border-radius:6px;display:grid;place-items:center;pointer-events:none}
  .speedorail span{writing-mode:vertical-rl;color:#fff;font-family:var(--brand);font-weight:700;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
  .spdnote{font-size:13px;color:var(--muted);line-height:1.55;margin:12px 4px 0;text-align:center}
  .spdnote b{color:var(--ink)}

  /* Power */
  .prlist{display:flex;flex-direction:column}
  .prrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-top:0;padding:12px 13px}
  .prrow:first-child{border-top:1px solid var(--line);border-radius:9px 9px 0 0}
  .prrow:last-child{border-radius:0 0 9px 9px}
  .prrow .pr{font-family:var(--brand);font-weight:700;font-size:23px;width:28px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
  .prrow .who{flex:1;min-width:0}
  .prrow .nm{font-family:var(--brand);font-weight:600;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prrow .sub{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lgtag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#fff;flex:none}
  .prrow .met{text-align:right;font-variant-numeric:tabular-nums}
  .prrow .met .r{font-family:var(--brand);font-weight:700;font-size:18px}

<body>
<div id="splash"><div class="box"><img class="splashlogo" id="splashLogo" src="ydubfflogo.png" alt="Y-Dub Fantasy Football" onerror="this.style.display='none'"><div class="sload">Loading…</div></div></div>
<div class="wrap">

  </header>

    <div class="leagues" role="tablist" id="leagueSeg"></div>

    </div>
    <div id="content"><div class="center"><span class="spin"></span>Loading your leagues…</div></div>
  </div>

  <div id="detail" hidden></div>
  <div id="pcard" hidden></div>

  <p class="foot"><b>Y-Dub Fantasy Football</b> — Ygnacio Wood NFC &amp; AFC, side by side all season.</p>
</div>

<script>
  const FN = "https://tsiaqvgcqziuzqfvjrun.supabase.co/functions/v1/ydub";
  const LK = { A:"nfl.l.875179", B:"nfl.l.1384656" };
  const PAL = ["#C0392E","#243B6B","#1F8A80","#B8860B","#6B4E9E","#2E8B4F","#D57A2B","#5A6B78","#B84A7E","#2E6FC8","#6E9A2E","#8A3245"];
  const POSC = {QB:"var(--qb)",RB:"var(--rb)",WR:"var(--wr)",TE:"var(--te)",K:"var(--k)","DEF":"var(--def)"};
  const LGC = { A:{tag:"var(--nfc)",dot:"var(--nfc)",bar:"var(--nfc)"}, B:{tag:"var(--afc)",dot:"var(--afc-bright)",bar:"var(--afc-bright)"} }; // NFC royal / AFC sky
  const barColor = () => (LGC[leagues[li]?.id]||{}).bar || "var(--accent)";
  const NFLALIAS={WAS:"WSH",WSH:"WAS",JAC:"JAX"};
  let nflMap={};
  async function loadNFL(){ try{
    const d=await getJSON("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
    const map={};
    (d.events||[]).forEach(e=>{ const c=e.competitions?.[0], st=e.status||{}, t=st.type||{}, comps=c?.competitors||[];
      comps.forEach((x,i)=>{ const me=(x.team?.abbreviation||"").toUpperCase(), opp=comps[1-i];
        map[me]={ state:t.state, detail:t.shortDetail, score:x.score, oppAbbr:(opp?.team?.abbreviation||"").toUpperCase(), oppScore:opp?.score, homeAway:x.homeAway, clock:st.displayClock, period:st.period }; }); });
    nflMap=map;
  }catch(e){} }
  const nflFor = abbr => nflMap[abbr] || nflMap[NFLALIAS[abbr]] || null;
  const SPEEDO = '<svg class="spd" viewBox="0 0 24 22" aria-hidden="true"><path d="M2.4 5.1Q12 2.7 21.6 5.1L20.4 9.7Q14.7 8.4 13.4 12.7 12.7 15 12 15 11.3 15 10.6 12.7 9.3 8.4 3.6 9.7Z" fill="#EC4899" stroke="#A81F60" stroke-width=".8" stroke-linejoin="round"/></svg>';
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const $ = s => document.querySelector(s);
  const frag = list => { const o={}; for(const f of list){ if(f && typeof f==="object" && !Array.isArray(f)) Object.assign(o,f);} return o; };
  const ownerOf = i => i.managers?.[0]?.manager?.nickname || "";
  const logoOf  = i => i.team_logos?.[0]?.team_logo?.url || "";
  const colorOf = id => PAL[(parseInt(id,10)||0) % PAL.length];
  const mono = n => { const w=String(n||"").replace(/[^A-Za-z ]/g," ").split(/\s+/).filter(Boolean); return ((w[0]?.[0]||"")+(w[1]?.[0]||"")).toUpperCase()||"?"; };
  const badge = (t,px) => `<span class="badge" style="width:${px}px;height:${px}px;--tc:${t.color}"><span class="mono">${esc(mono(t.name))}</span>${t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`;

  function parseStandings(js){
    const lg = js?.fantasy_content?.league; if(!lg) return null;
    const meta = lg[0], teamsObj = lg[1]?.standings?.[0]?.teams || {}, teams=[];
    for(const k in teamsObj){ if(k==="count") continue;
      const t = teamsObj[k].team, info = frag(t[0]); let st={};
      for(const part of t.slice(1)){ if(part?.team_standings) st=part.team_standings; }
      const ot = st.outcome_totals || {};
      teams.push({ id:info.team_id, name:info.name, owner:ownerOf(info), logo:logoOf(info), color:colorOf(info.team_id),
        rank:+(st.rank||0), wins:+(ot.wins||0), losses:+(ot.losses||0), ties:+(ot.ties||0), moves:+(info.number_of_moves||0),
        pf:+(st.points_for||0), pa:+(st.points_against||0),
        streak: st.streak ? (st.streak.type==="win"?"W":"L")+st.streak.value : "" });
    }
    teams.sort((a,b)=>a.rank-b.rank);
    return { key:meta.league_key, name:meta.name, season:meta.season, week:+(meta.current_week||0), teams };
  }
  function parseScoreboard(js){
    const lg = js?.fantasy_content?.league; if(!lg) return [];
    const mk = lg[1]?.scoreboard?.["0"]?.matchups || {}, out=[];
    for(const k in mk){ if(k==="count") continue;
      const m = mk[k].matchup, tObj = m["0"]?.teams || {}, sides=[];
      for(const tk in tObj){ if(tk==="count") continue;
        const t=tObj[tk].team, info=frag(t[0]), p=t[1]||{};
        sides.push({ id:info.team_id, name:info.name, owner:ownerOf(info), logo:logoOf(info), color:colorOf(info.team_id),
          score:+(p.team_points?.total||0), proj:+(p.team_projected_points?.total||0),
          winprob: p.win_probability!=null ? Math.round(p.win_probability*100) : null });
      }
      out.push({ status:m.status, gotw:m.is_matchup_of_the_week==="1", playoffs:m.is_playoffs==="1", a:sides[0], b:sides[1] });
    }
    return out;
  }
  function parseSettings(js){ const lg=js?.fantasy_content?.league; const s=lg?.[1]?.settings?.[0]||{};
    const map={}; (s.stat_categories?.stats||[]).forEach(c=>{ const st=c.stat; if(st) map[String(st.stat_id)]=st.display_name||st.name||("#"+st.stat_id); });
    return { playoffTeams:+(s.num_playoff_teams||6), playoffStart:+(s.playoff_start_week||15), endWeek:+(s.end_week||17), statMap:map }; }

  // playoff status + pink-speedo odds (Monte Carlo estimate)
  function computeExtras(L){
    const teams=L.teams, N=L.playoffTeams||6, W=L.regWeeks||14;
    const rem=t=>Math.max(0,W-(t.wins+t.losses+t.ties));
    teams.forEach(t=>{ const r=rem(t), maxW=t.wins+r, minW=t.wins;
      const guaranteedAbove=teams.filter(o=>o!==t && o.wins>maxW).length;
      const couldBeAbove=teams.filter(o=>o!==t && (o.wins+rem(o))>minW).length;
      t.po = guaranteedAbove>=N ? "out" : (couldBeAbove<N ? "clinch" : ((t.rank||99)<=N ? "in" : "hunt"));
    });
    const mean=teams.reduce((a,t)=>a+t.pf,0)/(teams.length||1);
    const sd=Math.sqrt(teams.reduce((a,t)=>a+(t.pf-mean)**2,0)/(teams.length||1))||1;
    const pw=t=>Math.min(0.82,Math.max(0.18,0.5+(t.pf-mean)/(2*sd)*0.5));
    const SIMS=2000, cnt={}; teams.forEach(t=>cnt[t.id]=0);
    for(let s=0;s<SIMS;s++){ const arr=teams.map(t=>{ let w=t.wins; const r=rem(t),pi=pw(t); for(let g=0;g<r;g++) if(Math.random()<pi) w++; return {id:t.id,w,pf:t.pf+Math.random()*0.001}; });
      arr.sort((a,b)=> a.w-b.w || a.pf-b.pf); cnt[arr[0].id]++; }
    teams.forEach(t=>{ t.odds=Math.round(cnt[t.id]/SIMS*100); });
  }
  // rank movement vs previous completed week (one extra fetch)
  async function loadMovement(L, who){
    try{
      const done=L.matchups.length && L.matchups.every(m=>m.status==="postevent");
      const lastW = done ? L.week : L.week-1;
      if(lastW<1){ L.teams.forEach(t=>t.move=0); return; }
      const sc=await getJSON(`${FN}/y?who=${who}&p=`+encodeURIComponent(`league/${LK[who]}/scoreboard;week=${lastW}`));
      const mts=parseScoreboard(sc), res={};
      mts.forEach(m=>{ const aw=m.a.score>=m.b.score; res[m.a.id]={won:aw,pts:m.a.score}; res[m.b.id]={won:!aw,pts:m.b.score}; });
      const prev=L.teams.map(t=>{ const r=res[t.id]||{won:false,pts:0}; return {id:t.id, w:t.wins-(r.won?1:0), pf:t.pf-r.pts}; });
      prev.sort((a,b)=> b.w-a.w || b.pf-a.pf);
      const pr={}; prev.forEach((o,i)=>pr[o.id]=i+1);
      L.teams.forEach(t=>{ t.move=(pr[t.id]||t.rank)-(t.rank||0); });
    }catch(e){ L.teams.forEach(t=>t.move=0); }
  }
  const lgChip=meta=>meta?`<span class="lgchip" style="--c:${meta.color}">${esc(meta.label)}</span>`:"";
  const awardCard=(emoji,title,team,sub,meta)=>`<div class="award tap" data-ti="${esc(team.id)}" data-gi="${meta?meta.gi:li}">${badge(team,44)}<div class="aw-info"><div class="aw-title"><span class="em">${emoji}</span>${esc(title)}</div><div class="aw-team">${esc(team.name)} ${lgChip(meta)}</div><div class="aw-sub">${esc(sub)}</div></div><span class="aw-go">›</span></div>`;

      const p=players[k].player, info=frag(p[0]); let sp=null,pp=null,ps=null;

        if(part && part.player_stats!=null) ps=part.player_stats;

      if(Array.isArray(sp)) sp=frag(sp);
      const slot = (sp&&sp.position) || "";

  function recapLockHTML(status, wk){
    const map={
      future:["🔒",`Week ${wk} hasn’t happened yet`,`The beat writer needs games to talk trash about — check back after Week ${wk} wraps.`],
      live:["✍️",`Week ${wk} is still cooking`,`The recap drops the moment the week’s final game goes final. Can’t roast a game that isn’t over.`],
      notstarted:["🗓️",`Week ${wk} hasn’t kicked off`,`No snaps, no smack talk. The recap posts once the week is in the books.`]
    };
    const [em,t,s]=map[status]||map.notstarted;
    return `<div class="awlock"><div class="awlock-em">${em}</div><div class="awlock-t">${t}</div><div class="awlock-s">${s}</div></div>`;
  }

  function renderStandings(L){

    let rows="";
    const poTag={in:["IN","po-in"],hunt:["HUNT","po-hunt"],clinch:["✓ CLINCH","po-cl"],out:["OUT","po-out"]};
    L.teams.forEach((t,i)=>{ const sc=t.streak?.[0]==="W"?"w":"l"; const cls=(t.speedo?"danger ":"")+(i===line?"cutline ":"")+"tap";
      const mv = t.move>0?`<span class="mv up">▲${t.move}</span>`:(t.move<0?`<span class="mv dn">▼${-t.move}</span>`:`<span class="mv fl">–</span>`);
      const po = poTag[t.po]||["",""];
      rows+=`<tr class="${cls}" data-ti="${esc(t.id)}">
        <td class="c-team stick"><div class="tmcell"><span class="rnkwrap"><span class="rnk">${t.rank||i+1}</span>${mv}</span>${badge(t,30)}<span class="tmtxt"><span class="nm">${esc(t.name)}${t.speedo?SPEEDO:""}</span><span class="ow">${esc(t.owner)}${po[0]?` <span class="po ${po[1]}">${po[0]}</span>`:""}</span></span></div></td>
        <td class="num">${t.wins}-${t.losses}${t.ties?"-"+t.ties:""}</td>

        <td class="num">${t.streak?`<b class="strk ${sc}">${esc(t.streak)}</b>`:"—"}</td>
        <td class="num muted">${t.moves||0}</td>
        <td class="num">${t.speedo?`<b class="odds">${t.odds}%</b>`:`<span class="muted">—</span>`}</td></tr>`; });
    const note = firstRisk>=0
      ? `<p class="spdnote">${SPEEDO} <b>Pink Speedo watch.</b> Every pink team can still finish dead last — the icon drops once they’re mathematically safe. Last place wears it. The <b>LAST%</b> column is each team’s estimated odds of finishing dead last.</p>`
      : `<p class="spdnote">${SPEEDO} Last place is locked in — the Pink Speedo has an owner.</p>`;

          <tbody>${rows}</tbody></table></div>
      </div>
      <div class="scrollhint">← swipe stats →</div>${note}`;
  }

    const line=p.stats&&p.stats.length?p.stats.map(s=>`${s.val} ${statMap[s.id]||""}`).join(" · "):(p.pts>0?"—":"Yet to play");
    showPCard(
      `<button class="pc-close" id="pcClose" aria-label="Close">✕</button>
       <div class="pc-hero" style="--pc:${POSC[p.pos]||'#456'}">
         <span class="pc-photo">${p.photo?`<img src="${esc(p.photo)}" onerror="this.remove()">`:esc(mono(p.name))}</span>
         <div class="pc-id"><div class="pc-name">${esc(p.name)}</div>
           <div class="pc-sub"><b>${esc(p.pos)}</b> · ${esc(p.team||"FA")}${p.num?" · #"+esc(p.num):""}${p.status?` · <b class="pc-inj">${esc(p.status)}</b>`:""}</div></div>
       </div>
       ${gameHTML}
       <div class="pc-pts"><div class="pc-big">${p.pts.toFixed(1)}</div><div class="pc-lbl">Fantasy Points · Week ${leagues[li].week}</div></div>
       <div class="pc-sec"><div class="pc-h">This week's stat line</div><div class="pc-line">${esc(line)}</div></div>
       <div id="pcExtra"><div class="pc-sec"><div class="pc-h">Season</div><div class="pc-line" style="color:var(--muted)">Loading…</div></div></div>
       <div class="pc-sec"><div class="pc-h">Rostered by</div><div class="pc-team">${badge(ft,28)}<span>${esc(ft.name)} · ${esc(ft.owner)}</span></div></div>`);
    $("#pcClose").onclick=navBack;
    if(p.key) (async()=>{
      try{
        const [ss,po]=await Promise.all([
          getJSON(`${FN}/y?who=${who}&p=`+encodeURIComponent(`player/${p.key}/stats;type=season`)),
          getJSON(`${FN}/y?who=${who}&p=`+encodeURIComponent(`player/${p.key}/percent_owned`)) ]);
        const sstats=pstatsOf(ss), spts=ppointsOf(ss), own=powndOf(po);
        const box=document.getElementById("pcExtra"); if(!box) return;
        let h="";
        if(sstats.length||spts!=null) h+=`<div class="pc-sec"><div class="pc-h">Season${spts!=null?` · ${(+spts).toFixed(1)} pts`:""}</div><div class="pc-line">${esc(sstats.map(s=>`${s.val} ${statMap[s.id]||""}`).join(" · ")||"—")}</div></div>`;
        if(own!=null) h+=`<div class="pc-sec"><div class="pc-h">Ownership</div><div class="pc-line">${esc(own)}% rostered across Yahoo</div></div>`;
        box.innerHTML=h;
      }catch(e){ const box=document.getElementById("pcExtra"); if(box) box.innerHTML=""; }
    })();
  }

  async function openTeam(lgi, ti){
    const L=leagues[lgi]; const t=L?.teams.find(x=>String(x.id)===String(ti)); if(!t) return;
    curDetail=null; navPush(hideDetail);
    showDetail(`<button class="back" id="backBtn">‹ Back</button><div class="center"><span class="spin"></span>Loading ${esc(t.name)}…</div>`);
    $("#backBtn").onclick=navBack;
    let ros;
    try{ const r=await getJSON(`${FN}/y?who=${L.id}&p=`+encodeURIComponent(`team/${L.key}.t.${ti}/roster;week=${L.week}/players/stats;type=week;week=${L.week}`)); ros=parseRoster(r); }catch(e){}
    if(!ros){ showDetail(`<button class="back" id="bb">‹ Back</button><div class="center">Couldn’t load roster.</div>`); $("#bb").onclick=navBack; return; }
    pmap={}; [...ros.starters,...ros.bench].forEach(p=>{ if(p.key) pmap[p.key]={p,team:t}; });
    const prow=(p)=>`<div class="srow tap" data-pk="${esc(p.key||'')}"><span class="sslot">${esc(p.slot||"")}</span>${pav(p)}<div class="sinfo"><span class="pn">${esc(p.name||"—")}</span><span class="pstat2"><b class="spos" style="color:${POSC[p.pos]||'#456'}">${esc(p.pos)}</b> · ${esc(p.team||"—")}${p.status?` · <b style="color:var(--loss)">${esc(p.status)}</b>`:""}</span></div><span class="pts" style="color:var(--ink)">${p.pts.toFixed(1)}</span></div>`;
    showDetail(
      `<button class="back" id="backBtn">‹ Back to Standings</button>
       <div class="tphead">${badge(t,54)}<div class="tpinfo"><div class="tpname">${esc(t.name)}</div><div class="tpown">${esc(t.owner)} · ${esc(L.name)}</div>
         <div class="tpkv"><span><b>#${t.rank}</b>Rank</span><span><b>${t.wins}-${t.losses}${t.ties?'-'+t.ties:''}</b>Rec</span><span><b>${t.pf.toFixed(1)}</b>PF</span><span><b>${t.pa.toFixed(1)}</b>PA</span></div></div></div>
       <div class="lineup"><div class="secrow">Starters · Week ${L.week}</div>${ros.starters.map(prow).join("")}<div class="secrow">Bench</div>${ros.bench.map(prow).join("")}</div>`);
    $("#backBtn").onclick=navBack;
    $("#detail").querySelectorAll("[data-pk]").forEach(el=>{ if(el.dataset.pk) el.onclick=()=>openPlayer(el.dataset.pk); });
  }

  const root=document.documentElement, tb=$("#themeBtn");
  function applyTheme(t){ if(t)root.setAttribute("data-theme",t); else root.removeAttribute("data-theme");
    const dark=t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches); tb.textContent=dark?"☀️":"🌙"; }
  let saved=null; try{ saved=localStorage.getItem("ydub-theme"); }catch(e){}
  applyTheme(saved);
  tb.onclick=()=>{ const dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
    const n=dark?"light":"dark"; applyTheme(n); try{localStorage.setItem("ydub-theme",n);}catch(e){} };

  // ---- Install (Add to Home Screen) ----
  let deferredPrompt=null;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
  function showInstall(){ if(isStandalone) return; try{ if(sessionStorage.getItem("ydub-inst-x")) return; }catch(e){} $("#installBar").hidden=false; }
  function hideInstall(){ $("#installBar").hidden=true; }
  addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; showInstall(); });
  addEventListener("appinstalled", ()=>{ deferredPrompt=null; hideInstall(); });
  if(isIOS && !isStandalone) showInstall();
  $("#installBtn").onclick=async()=>{
    if(deferredPrompt){ deferredPrompt.prompt(); const r=await deferredPrompt.userChoice.catch(()=>null); deferredPrompt=null; if(r&&r.outcome==="accepted") hideInstall(); }
    else if(isIOS){ alert('To install: tap the Share button (the box with an ↑) at the bottom of Safari, then choose “Add to Home Screen.”'); }
    else { alert('In Chrome: tap the ⋮ menu (top-right), then “Add to Home screen” / “Install app.”'); }
  };
  $("#installX").onclick=()=>{ hideInstall(); try{ sessionStorage.setItem("ydub-inst-x","1"); }catch(e){} };

  addEventListener("resize",()=>{ if(view==="standings" && !$("#home").hidden) positionRail(); });
  document.fonts?.ready?.then(()=>{ if(view==="standings" && !$("#home").hidden) positionRail(); });
  $("#homeLink").onclick=()=>{ hidePCard(); hideDetail(); navReset();
    view="matchups"; [...$("#viewSeg").children].forEach(x=>x.setAttribute("aria-selected",x.dataset.view==="matchups")); render(); window.scrollTo(0,0); };

  (function(){ const sl=document.getElementById("splashLogo"); if(!sl) return;
    const show=()=>sl.classList.add("in");
    if(sl.complete && sl.naturalWidth){ sl.decode?sl.decode().then(show).catch(show):show(); }
    else { sl.addEventListener("load",()=>{ sl.decode?sl.decode().then(show).catch(show):show(); }); }
  })();
  function dismissSplash(){ const s=$("#splash"); if(!s) return; s.classList.add("hide"); setTimeout(()=>s.remove(),540); }
  const splashStart=Date.now();
  loadAll().finally(()=>setTimeout(dismissSplash, Math.max(0, 1600-(Date.now()-splashStart))));
  setTimeout(dismissSplash, 6000);
  setInterval(()=>{ if($("#detail").hidden) loadAll(); }, 90000);
</script>
</body>
</html>
