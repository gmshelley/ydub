<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y-Dub Fantasy Football</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Y-Dub Fantasy Football">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E9EDF1; --ink:#141B23;
    --muted:#57626E; --line:#D8DEE4; --line-strong:#BFC7D0;
    --accent:#1E47A0; --on-accent:#FFFFFF; --accent-soft:#E6EDF8;
    --win:#1C7C42; --loss:#B23A2C; --live:#D64545;
    --nfc:#1E47A0; --afc:#2C82C9; --afc-bright:#5AA9E6;
    --qb:#C0392E; --rb:#2E8B4F; --wr:#2E6FC8; --te:#D57A2B; --k:#6B4E9E; --def:#5A6B78;
    --brand:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0B1015; --surface:#131A21; --surface-2:#1B242D; --ink:#EAF0F6;
    --muted:#9BA8B4; --line:#26313B; --line-strong:#3A4652;
    --accent:#5AA9E6; --on-accent:#08243B; --accent-soft:#15303F;
    --win:#43C27E; --loss:#E5695B; --live:#FF5A54;
    --nfc:#3E74C9; --afc:#5AA9E6; --afc-bright:#7CC0F0;
  }}
  :root[data-theme="dark"]{
    --bg:#0B1015; --surface:#131A21; --surface-2:#1B242D; --ink:#EAF0F6;
    --muted:#9BA8B4; --line:#26313B; --line-strong:#3A4652;
    --accent:#5AA9E6; --on-accent:#08243B; --accent-soft:#15303F;
    --win:#43C27E; --loss:#E5695B; --live:#FF5A54;
    --nfc:#3E74C9; --afc:#5AA9E6; --afc-bright:#7CC0F0;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  img{max-width:100%} button{font-family:inherit}
  .wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

  /* Header */
  header{display:flex;align-items:center;gap:12px;padding-block:16px 14px;border-bottom:2px solid var(--ink);margin-bottom:2px}
  .mark{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .logo{width:46px;height:46px;border-radius:50%;flex:none;background:#000}
  .wordmark{font-family:var(--brand);font-weight:700;font-size:32px;letter-spacing:.005em;line-height:.84;text-transform:uppercase}
  .wordmark b{color:var(--accent)}
  .tag{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
  .theme-btn{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{border-color:var(--line-strong)}

  .updated{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:9px 2px 0}
  .updated .rdot{width:7px;height:7px;border-radius:50%;background:var(--win)}
  .updated button{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px}

  /* League switch — flat toggle, active fills with league color */
  .leagues{display:flex;gap:8px;margin:12px 0 6px}
  .leagues button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;
    font-weight:600;font-size:15px;padding:11px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;
    line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leagues button .swatch{width:10px;height:10px;border-radius:50%;flex:none;background:var(--lg,var(--muted))}
  .leagues button[aria-selected="true"]{background:var(--lg,var(--accent));color:#fff;border-color:transparent;font-weight:700}
  .leagues button[aria-selected="true"] .swatch{background:rgba(255,255,255,.9)}

  /* View tabs — underline style, not pills */
  .view{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:10px 0 2px}
  .view button{background:none;border:0;cursor:pointer;color:var(--muted);font-family:var(--brand);text-transform:uppercase;
    letter-spacing:.06em;font-size:17px;font-weight:600;padding:10px 0;position:relative}
  .view button[aria-selected="true"]{color:var(--ink)}
  .view button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}

  /* Section header — left aligned with rule */
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
  .sec h2{font-family:var(--brand);text-transform:uppercase;font-weight:700;font-size:21px;letter-spacing:.02em;margin:0;line-height:1}
  .state{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.12em;padding:3px 9px;border-radius:3px;font-weight:700}
  .state.live{background:color-mix(in srgb,var(--live) 16%,transparent);color:var(--live)}
  .state.final{color:var(--muted);border:1px solid var(--line)}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.livedot,.spin,.splashlogo{animation:none}}

  .badge{border-radius:7px;flex:none;position:relative;display:inline-grid;place-items:center;overflow:hidden;color:#fff;font-family:var(--brand);font-weight:700;background:var(--tc,#456)}
  .badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .badge .mono{font-size:.42em}

  /* Matchups — flat, hairline, no shadow */
  .matchups{display:flex;flex-direction:column;gap:10px}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;width:100%;text-align:left;color:inherit;cursor:pointer;padding:0}
  .mcard:hover{border-color:var(--line-strong)}
  .team{display:flex;align-items:center;gap:12px;padding:13px 14px}
  .team .who{flex:1;min-width:0}
  .team .name{font-family:var(--brand);font-weight:600;font-size:21px;line-height:1.04;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .owner{font-size:15px;color:var(--muted);margin-top:3px}
  .team .score{font-family:var(--brand);font-weight:700;font-size:29px;line-height:1;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
  .team .proj{display:block;font-size:13.5px;color:var(--muted);text-align:right;margin-top:3px}
  .team.trail{color:var(--muted)}
  .team.trail .name{color:var(--muted)}
  .mid{display:flex;align-items:center;gap:10px;padding:0 14px 2px}
  .mid .wp{flex:1;height:5px;border-radius:0;overflow:hidden;display:flex;background:var(--surface-2)}
  .mid .vs{font-family:var(--brand);font-size:13px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .mid .pct{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
  .taphint{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:8px 14px;font-size:12px;letter-spacing:.04em;color:var(--accent);font-weight:700;border-top:1px solid var(--line)}

  /* Standings — clean table, hairlines */
  .board{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{font-family:var(--brand);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12.5px;color:var(--muted);text-align:right;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
  thead th.lft{text-align:left;padding-left:14px}
  tbody td{padding:11px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;text-align:right;font-size:16px;font-weight:600}
  tbody td.tm{text-align:left;padding-left:14px}
  .tmcell{display:flex;align-items:center;gap:11px}
  tbody tr:first-child td{border-top:0}
  .rank{font-family:var(--brand);font-weight:700;font-size:18px;color:var(--muted);width:22px;text-align:center}
  .tm .nm{font-family:var(--brand);font-weight:600;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm .ow{font-size:14px;color:var(--muted);font-weight:500}
  td .pf{color:var(--muted);font-weight:600}
  .strk{font-family:var(--brand);font-weight:700;font-size:14px}
  .strk.w{color:var(--win)} .strk.l{color:var(--loss)}
  tr.cut td{border-top:2px solid var(--ink)}
  .cutlabel td{padding:5px 14px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}

  /* Standings rows + Pink Speedo Zone */
  .strow{display:grid;grid-template-columns:24px 1fr 58px 62px 46px;align-items:center;gap:10px;padding:11px 12px 11px 36px;border-top:1px solid var(--line)}
  .board > .strow:first-child{border-top:0}
  .strow.sthead{font-family:var(--brand);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding-block:9px}
  .strow .c-rk{font-family:var(--brand);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
  .strow.sthead .c-rk,.strow.sthead .c-rc,.strow.sthead .c-pf,.strow.sthead .c-sk{font-size:12.5px;font-weight:600}
  .strow .c-rc,.strow .c-pf,.strow .c-sk{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
  .strow .c-pf{color:var(--muted)}
  .strow .tmcell{display:flex;align-items:center;gap:11px;min-width:0}
  .strow .tmtxt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
  .strow .nm{font-family:var(--brand);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strow .ow{font-size:14px;color:var(--muted);font-weight:500}
  .spd{display:inline-block;width:17px;height:15px;vertical-align:-2px;margin-left:4px}
  .spdnote .spd{vertical-align:-3px;margin:0 2px 0 0;width:18px;height:16px}
  .strow.danger{background:color-mix(in srgb,#EC4899 8%,var(--surface))}
  .strow.cutline{border-top:2px solid var(--ink)}
  .speedozone{position:relative}
  .speedorail{position:absolute;left:5px;top:5px;bottom:5px;width:25px;background:#EC4899;border-radius:6px;display:grid;place-items:center;pointer-events:none}
  .speedorail span{writing-mode:vertical-rl;color:#fff;font-family:var(--brand);font-weight:700;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
  .spdnote{font-size:13px;color:var(--muted);line-height:1.55;margin:12px 4px 0;text-align:center}
  .spdnote b{color:var(--ink)}

  /* Power */
  .prlist{display:flex;flex-direction:column}
  .prrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-top:0;padding:12px 13px}
  .prrow:first-child{border-top:1px solid var(--line);border-radius:9px 9px 0 0}
  .prrow:last-child{border-radius:0 0 9px 9px}
  .prrow .pr{font-family:var(--brand);font-weight:700;font-size:23px;width:28px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
  .prrow .who{flex:1;min-width:0}
  .prrow .nm{font-family:var(--brand);font-weight:600;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prrow .sub{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lgtag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#fff;flex:none}
  .prrow .met{text-align:right;font-variant-numeric:tabular-nums}
  .prrow .met .r{font-family:var(--brand);font-weight:700;font-size:18px}
  .prrow .met .p{font-size:12px;color:var(--muted)}

  /* Matchup detail */
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--accent);font-weight:700;font-size:15px;padding:10px 0 2px}
  .dhead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:15px 12px}
  .dt{min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
  .dt .dnm{font-family:var(--brand);font-weight:600;font-size:16px;line-height:1.02;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dt .dow{font-size:13.5px;color:var(--muted)}
  .dt .dsc{font-family:var(--brand);font-weight:700;font-size:34px;line-height:.95;font-variant-numeric:tabular-nums;margin-top:2px}
  .dt .dpj{font-size:12px;color:var(--muted)}
  .dt.trail .dsc{color:var(--muted)}
  .dmid{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dmid .vs{font-family:var(--brand);font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .wpwrap{margin-top:12px}
  .wpbar{height:7px;overflow:hidden;display:flex;background:var(--surface-2);border-radius:0}
  .wplab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:6px;font-variant-numeric:tabular-nums}
  .lineup{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:14px}
  .secrow{font-family:var(--brand);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:8px 12px}
  .prow{display:grid;grid-template-columns:1fr 46px 1fr;align-items:stretch;border-top:1px solid var(--line)}
  .pcell{display:flex;align-items:center;gap:9px;min-width:0;padding:9px 10px}
  .pcell.r{flex-direction:row-reverse;text-align:right}
  .slot{display:grid;place-items:center;background:var(--surface-2);font-family:var(--brand);font-weight:700;font-size:11.5px;color:var(--muted);border-inline:1px solid var(--line);letter-spacing:.02em;padding:0 2px}
  .pav{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--brand);font-weight:700;font-size:12px;background:var(--pc,#456)}
  .pav img{width:100%;height:100%;object-fit:cover;object-position:top}
  .pinfo{min-width:0;flex:1;display:flex;flex-direction:column}
  .pcell.r .pinfo{align-items:flex-end}
  .pn{font-weight:600;font-size:14.5px;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pm .inj{color:var(--loss);font-weight:700}
  .pts{font-family:var(--brand);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;flex:none;color:var(--muted)}
  .prow.lead-a .pcell:first-child .pts,.prow.lead-b .pcell:last-child .pts{color:var(--ink)}
  .totrow{display:grid;grid-template-columns:1fr 46px 1fr;background:var(--surface-2);font-family:var(--brand);font-weight:700;border-top:2px solid var(--ink)}
  .totrow .tc{padding:9px 12px;font-variant-numeric:tabular-nums;font-size:19px}
  .totrow .tc.r{text-align:right}
  .totrow .tm{display:grid;place-items:center;font-size:11px;color:var(--muted);letter-spacing:.1em}
  .legend{display:flex;flex-wrap:wrap;gap:7px 14px;justify-content:center;margin:14px 2px 0}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  .legend i{width:9px;height:9px;border-radius:2px}

  .note{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:26px 18px;text-align:center;margin-top:16px}
  .note h3{font-family:var(--brand);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px;font-size:20px}
  .note p{color:var(--muted);font-size:14.5px;margin:0 0 16px;line-height:1.5}
  .note a.btn{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px}
  .center{text-align:center;color:var(--muted);padding:44px 0;font-size:15px}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);line-height:1.6}
  .foot b{color:var(--ink)}

  /* Splash */
  #splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .box{display:flex;flex-direction:column;align-items:center;gap:20px}
  .splashlogo{width:min(60vw,250px);height:auto;border-radius:50%;background:#000;animation:pop .75s cubic-bezier(.2,.8,.25,1.3) both}
  #splash .sload{font-family:var(--brand);text-transform:uppercase;letter-spacing:.28em;font-size:12.5px;color:var(--muted);animation:sfade .9s .5s both}
  @keyframes pop{0%{opacity:0;transform:scale(.5)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
  @keyframes sfade{from{opacity:0}to{opacity:1}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="splash"><div class="box"><img class="splashlogo" src="ydubfflogo.png" alt="Y-Dub Fantasy Football" onerror="this.style.display='none'"><div class="sload">Loading…</div></div></div>
<div class="wrap">
  <header>
    <div class="mark">
      <img class="logo" src="ydubfflogo.png" alt="Y-Dub" onerror="this.style.display='none'">
      <div><span class="wordmark">Y-<b>Dub</b></span><span class="tag">Fantasy Football</span></div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Switch light / dark">🌙</button>
  </header>

  <div id="home">
    <div class="updated" id="updated"></div>
    <div class="leagues" role="tablist" id="leagueSeg"></div>
    <div class="view" role="tablist" id="viewSeg">
      <button role="tab" data-view="matchups" aria-selected="true">Matchups</button>
      <button role="tab" data-view="standings" aria-selected="false">Standings</button>
      <button role="tab" data-view="power" aria-selected="false">Power</button>
    </div>
    <div id="content"><div class="center"><span class="spin"></span>Loading your leagues…</div></div>
  </div>

  <div id="detail" hidden></div>

  <p class="foot"><b>Y-Dub Fantasy Football</b> — Ygnacio Wood NFC &amp; AFC, side by side all season.</p>
</div>

<script>
  const FN = "https://tsiaqvgcqziuzqfvjrun.supabase.co/functions/v1/ydub";
  const LK = { A:"nfl.l.875179", B:"nfl.l.1384656" };
  const PAL = ["#C0392E","#243B6B","#1F8A80","#B8860B","#6B4E9E","#2E8B4F","#D57A2B","#5A6B78","#B84A7E","#2E6FC8","#6E9A2E","#8A3245"];
  const POSC = {QB:"var(--qb)",RB:"var(--rb)",WR:"var(--wr)",TE:"var(--te)",K:"var(--k)","DEF":"var(--def)"};
  const LGC = { A:{tag:"var(--nfc)",dot:"var(--nfc)"}, B:{tag:"var(--afc)",dot:"var(--afc-bright)"} }; // NFC royal / AFC sky
  const SPEEDO = '<svg class="spd" viewBox="0 0 24 22" aria-hidden="true"><path d="M2.4 5.1Q12 2.7 21.6 5.1L20.4 9.7Q14.7 8.4 13.4 12.7 12.7 15 12 15 11.3 15 10.6 12.7 9.3 8.4 3.6 9.7Z" fill="#EC4899" stroke="#A81F60" stroke-width=".8" stroke-linejoin="round"/></svg>';
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const $ = s => document.querySelector(s);
  const frag = list => { const o={}; for(const f of list){ if(f && typeof f==="object" && !Array.isArray(f)) Object.assign(o,f);} return o; };
  const ownerOf = i => i.managers?.[0]?.manager?.nickname || "";
  const logoOf  = i => i.team_logos?.[0]?.team_logo?.url || "";
  const colorOf = id => PAL[(parseInt(id,10)||0) % PAL.length];
  const mono = n => { const w=String(n||"").replace(/[^A-Za-z ]/g," ").split(/\s+/).filter(Boolean); return ((w[0]?.[0]||"")+(w[1]?.[0]||"")).toUpperCase()||"?"; };
  const badge = (t,px) => `<span class="badge" style="width:${px}px;height:${px}px;--tc:${t.color}"><span class="mono">${esc(mono(t.name))}</span>${t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`;

  function parseStandings(js){
    const lg = js?.fantasy_content?.league; if(!lg) return null;
    const meta = lg[0], teamsObj = lg[1]?.standings?.[0]?.teams || {}, teams=[];
    for(const k in teamsObj){ if(k==="count") continue;
      const t = teamsObj[k].team, info = frag(t[0]); let st={};
      for(const part of t.slice(1)){ if(part?.team_standings) st=part.team_standings; }
      const ot = st.outcome_totals || {};
      teams.push({ id:info.team_id, name:info.name, owner:ownerOf(info), logo:logoOf(info), color:colorOf(info.team_id),
        rank:+(st.rank||0), wins:+(ot.wins||0), losses:+(ot.losses||0), ties:+(ot.ties||0),
        pf:+(st.points_for||0), pa:+(st.points_against||0),
        streak: st.streak ? (st.streak.type==="win"?"W":"L")+st.streak.value : "" });
    }
    teams.sort((a,b)=>a.rank-b.rank);
    return { key:meta.league_key, name:meta.name, season:meta.season, week:+(meta.current_week||0), teams };
  }
  function parseScoreboard(js){
    const lg = js?.fantasy_content?.league; if(!lg) return [];
    const mk = lg[1]?.scoreboard?.["0"]?.matchups || {}, out=[];
    for(const k in mk){ if(k==="count") continue;
      const m = mk[k].matchup, tObj = m["0"]?.teams || {}, sides=[];
      for(const tk in tObj){ if(tk==="count") continue;
        const t=tObj[tk].team, info=frag(t[0]), p=t[1]||{};
        sides.push({ id:info.team_id, name:info.name, owner:ownerOf(info), logo:logoOf(info), color:colorOf(info.team_id),
          score:+(p.team_points?.total||0), proj:+(p.team_projected_points?.total||0),
          winprob: p.win_probability!=null ? Math.round(p.win_probability*100) : null });
      }
      out.push({ status:m.status, a:sides[0], b:sides[1] });
    }
    return out;
  }
  function parseSettings(js){ const lg=js?.fantasy_content?.league; const s=lg?.[1]?.settings?.[0]||{};
    return { playoffTeams:+(s.num_playoff_teams||6), playoffStart:+(s.playoff_start_week||15) }; }
  function parseRoster(js){
    const team = js?.fantasy_content?.team; if(!team) return null;
    let rosterPart=null; for(const part of team){ if(part && part.roster) rosterPart=part.roster; }
    const players = rosterPart?.["0"]?.players || {};
    const starters=[], bench=[];
    for(const k in players){ if(k==="count" || !players[k].player) continue;
      const p=players[k].player, info=frag(p[0]); let sp=null,pp=null;
      for(const part of p.slice(1)){
        if(part && part.selected_position!=null) sp=part.selected_position;
        if(part && part.player_points!=null) pp=part.player_points;
      }
      if(Array.isArray(sp)) sp=frag(sp);
      const slot = (sp&&sp.position) || "";
      const pl={ name:info.name?.full||"", pos:info.display_position||"", team:(info.editorial_team_abbr||"").toUpperCase(),
        pts:+(pp?.total||0), status:info.status||"", photo:info.headshot?.url||info.image_url||"", slot };
      if(slot==="BN"||slot==="IR") bench.push(pl); else starters.push(pl);
    }
    return { starters, bench };
  }

  let leagues=[], li=0, view="matchups";
  async function getJSON(u){ const r=await fetch(u,{cache:"no-store"}); return r.json(); }
  async function loadLeague(who){
    try{
      const [st,sc,set]=await Promise.all([
        getJSON(`${FN}/raw?who=${who}&kind=standings`),
        getJSON(`${FN}/raw?who=${who}&kind=scoreboard`),
        getJSON(`${FN}/y?who=${who}&p=`+encodeURIComponent(`league/${LK[who]}/settings`)).catch(()=>({})) ]);
      if(!st?.fantasy_content) return { id:who, connected:false };
      const s=parseStandings(st), cfg=parseSettings(set), regWeeks=(cfg.playoffStart||15)-1;
      s.teams.forEach(t=>{ const safe=s.teams.some(o=>o!==t && (o.wins+(regWeeks-(o.wins+o.losses+o.ties)))<t.wins); t.speedo=!safe; });
      return { id:who, connected:true, ...s, playoffTeams:cfg.playoffTeams||6, regWeeks, matchups:parseScoreboard(sc) };
    }catch(e){ return { id:who, connected:false }; }
  }
  async function loadAll(){
    leagues = await Promise.all([loadLeague("A"), loadLeague("B")]);
    if(!leagues[li] || (!leagues[li].connected && leagues.some(l=>l.connected))) li = Math.max(0,leagues.findIndex(l=>l.connected));
    renderLeagueTabs(); if($("#detail").hidden) render();
    const t=new Date();
    $("#updated").innerHTML = `<span class="rdot"></span>Updated ${t.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}<button id="refreshBtn">Refresh</button>`;
    $("#refreshBtn").onclick=()=>loadAll();
  }
  function renderLeagueTabs(){
    const seg=$("#leagueSeg"); seg.innerHTML="";
    leagues.forEach((L,i)=>{
      const b=document.createElement("button"); b.setAttribute("role","tab"); b.setAttribute("aria-selected",i===li);
      if(L.connected && LGC[L.id]) b.style.setProperty("--lg", LGC[L.id].tag);
      const label = L.connected ? L.name : (i===1?"League B":"League A");
      b.innerHTML = `<span class="swatch"></span>${esc(label)}`;
      b.onclick=()=>{ li=i; [...seg.children].forEach((x,j)=>x.setAttribute("aria-selected",j===li)); render(); };
      seg.appendChild(b);
    });
  }
  $("#viewSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
    view=b.dataset.view; [...$("#viewSeg").children].forEach(x=>x.setAttribute("aria-selected",x===b)); render(); });

  function render(){
    const L=leagues[li], c=$("#content");
    if(!L){ c.innerHTML=`<div class="center">No leagues loaded.</div>`; return; }
    if(!L.connected){
      c.innerHTML=`<div class="note"><h3>${L.id==="B"?"League B isn’t connected yet":"Not connected"}</h3>
        <p>${L.id==="B"?"Have a buddy who’s in that league tap the button and hit <b>Allow</b> — one time only.":"This league needs to be connected once."}</p>
        <a class="btn" href="${FN}/login?who=${L.id}">Connect ${L.id==="B"?"League B":"League A"}</a></div>`;
      return;
    }
    if(view==="matchups") c.innerHTML = renderMatchups(L);
    else if(view==="standings") c.innerHTML = renderStandings(L);
    else c.innerHTML = renderPower();
    if(view==="matchups") c.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>openMatchup(+el.dataset.mi));
  }
  const statusTag = s => s==="postevent"?`<span class="state final">FINAL</span>`:s==="preevent"?`<span class="state final">UPCOMING</span>`:`<span class="state live"><span class="livedot"></span>LIVE</span>`;

  function renderMatchups(L){
    if(!L.matchups.length) return `<div class="sec"><h2>Week ${L.week}</h2></div><div class="center">No matchups posted yet.</div>`;
    const anyLive = L.matchups.some(m=>m.status==="midevent");
    let h=`<div class="sec"><h2>Week ${L.week}</h2>${anyLive?statusTag("midevent"):statusTag(L.matchups[0].status)}</div><div class="matchups">`;
    L.matchups.forEach((m,mi)=>{
      const aLead=m.a.score>=m.b.score;
      const row=(t,lead)=>`<div class="team ${lead?'':'trail'}">${badge(t,40)}
        <div class="who"><div class="name">${esc(t.name)}</div><div class="owner">${esc(t.owner)}</div></div>
        <div><div class="score">${t.score.toFixed(1)}</div><span class="proj">proj ${t.proj.toFixed(0)}</span></div></div>`;
      const pa=m.a.winprob, pb=m.b.winprob;
      const wp = (pa!=null&&pb!=null) ? `<span class="pct">${pa}%</span><span class="wp"><i style="width:${pa}%;background:var(--accent)"></i><i style="width:${pb}%;background:var(--line-strong)"></i></span><span class="pct">${pb}%</span>` : `<span class="vs">vs</span>`;
      h+=`<button class="mcard" data-mi="${mi}">${row(m.a,aLead)}<div class="mid">${wp}</div>${row(m.b,!aLead)}<div class="taphint">Full lineups ›</div></button>`;
    });
    return h+`</div>`;
  }
  function renderStandings(L){
    const line=L.playoffTeams||6;
    const firstRisk=L.teams.findIndex(t=>t.speedo);
    const head=`<div class="strow sthead"><span class="c-rk">#</span><span class="c-tm">Team</span><span class="c-rc">Rec</span><span class="c-pf">PF</span><span class="c-sk">Strk</span></div>`;
    const rowHTML=(t,i)=>{ const sc=t.streak?.[0]==="W"?"w":"l"; const cut=(i===line)?" cutline":"";
      return `<div class="strow${t.speedo?" danger":""}${cut}">
        <span class="c-rk">${t.rank||i+1}</span>
        <span class="c-tm"><div class="tmcell">${badge(t,30)}<span class="tmtxt"><span class="nm">${esc(t.name)}${t.speedo?SPEEDO:""}</span><span class="ow">${esc(t.owner)}</span></span></div></span>
        <span class="c-rc">${t.wins}-${t.losses}${t.ties?"-"+t.ties:""}</span>
        <span class="c-pf">${t.pf.toFixed(1)}</span>
        <span class="c-sk">${t.streak?`<b class="strk ${sc}">${esc(t.streak)}</b>`:"—"}</span></div>`; };
    let safeRows="", zoneRows="";
    L.teams.forEach((t,i)=>{ if(firstRisk>=0 && i>=firstRisk) zoneRows+=rowHTML(t,i); else safeRows+=rowHTML(t,i); });
    const zone = zoneRows ? `<div class="speedozone"><div class="speedorail"><span>Pink Speedo Zone</span></div>${zoneRows}</div>` : "";
    const note = firstRisk>=0
      ? `<p class="spdnote">${SPEEDO} <b>Pink Speedo watch.</b> Every team marked can still finish dead last — the icon drops the moment they’re mathematically safe. Last place in each league wears it.</p>`
      : `<p class="spdnote">${SPEEDO} Last place is locked in — the Pink Speedo has an owner.</p>`;
    return `<div class="sec"><h2>${esc(L.name)}</h2></div><div class="board">${head}${safeRows}${zone}</div>${note}`;
  }
  function renderPower(){
    const all=[]; leagues.forEach(L=>{ if(!L.connected) return; L.teams.forEach(t=>all.push({L,t,score:(t.wins-t.losses)*40+t.pf})); });
    if(!all.length) return `<div class="center">Connect a league to see power rankings.</div>`;
    all.sort((a,b)=>b.score-a.score);
    let h=`<div class="sec"><h2>Power Rankings</h2><span class="state final">BOTH LEAGUES</span></div><div class="prlist">`;
    all.forEach((o,i)=>{ const t=o.t, c=LGC[o.L.id]||{tag:"var(--accent)"};
      h+=`<div class="prrow"><span class="pr">${i+1}</span>${badge(t,38)}
        <div class="who"><div class="nm">${esc(t.name)}</div><div class="sub"><span class="lgtag" style="background:${c.tag}">${esc(o.L.name)}</span> ${esc(t.owner)}</div></div>
        <div class="met"><div class="r">${t.wins}-${t.losses}</div><div class="p">${t.pf.toFixed(1)} PF</div></div></div>`;
    });
    return h+`</div>`;
  }

  // ---- Matchup detail ----
  function showDetail(inner){ $("#detail").innerHTML=inner; $("#detail").hidden=false; $("#home").hidden=true; window.scrollTo(0,0); }
  function hideDetail(){ $("#detail").hidden=true; $("#home").hidden=false; window.scrollTo(0,0); }
  const pav = p => `<span class="pav" style="--pc:${POSC[p.pos]||'#456'}">${p.photo?`<img src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.remove()">`:esc(mono(p.name))}</span>`;
  const pmeta = p => `<span class="pm">${esc(p.pos)} · ${esc(p.team||"—")}${p.status?` <span class="inj">${esc(p.status)}</span>`:""}</span>`;

  async function openMatchup(mi){
    const L=leagues[li], m=L.matchups[mi];
    showDetail(`<button class="back" id="backBtn">‹ Back to Week ${L.week}</button><div class="center"><span class="spin"></span>Loading lineups…</div>`);
    $("#backBtn").onclick=hideDetail;
    const wk=L.week, who=L.id, key=L.key;
    const path = id => `team/${key}.t.${id}/roster;week=${wk}/players/stats;type=week;week=${wk}`;
    let la,lb;
    try{
      const [ra,rb]=await Promise.all([ getJSON(`${FN}/y?who=${who}&p=`+encodeURIComponent(path(m.a.id))), getJSON(`${FN}/y?who=${who}&p=`+encodeURIComponent(path(m.b.id))) ]);
      la=parseRoster(ra); lb=parseRoster(rb);
    }catch(e){}
    if(!la||!lb){ showDetail(`<button class="back" id="bb">‹ Back</button><div class="center">Couldn’t load lineups. Try again.</div>`); $("#bb").onclick=hideDetail; return; }
    renderDetail(m,la,lb);
  }
  function renderDetail(m,la,lb){
    const aLead=m.a.score>=m.b.score;
    const pa=m.a.winprob, pb=m.b.winprob;
    const head = (t,trail)=>`<div class="dt ${trail?'trail':''}">${badge(t,42)}
      <span class="dnm">${esc(t.name)}</span><span class="dow">${esc(t.owner)}</span>
      <span class="dsc">${t.score.toFixed(1)}</span><span class="dpj">proj ${t.proj.toFixed(0)}</span></div>`;
    const wp = (pa!=null&&pb!=null)?`<div class="wpwrap"><div class="wpbar"><i style="width:${pa}%;background:var(--accent)"></i><i style="width:${pb}%;background:var(--line-strong)"></i></div>
      <div class="wplab"><span>${pa}% win</span><span>win ${pb}%</span></div></div>`:"";
    const cell=(p,right)=>`<div class="pcell ${right?'r':''}">${pav(p)}<div class="pinfo"><span class="pn">${esc(p.name||"—")}</span>${pmeta(p)}</div><span class="pts">${p.pts.toFixed(1)}</span></div>`;
    const rows=(A,B)=>{ let h=""; const n=Math.max(A.length,B.length);
      for(let i=0;i<n;i++){ const x=A[i]||{name:"",pos:"",team:"",pts:0,slot:""}, y=B[i]||{name:"",pos:"",team:"",pts:0};
        const lead = x.pts===y.pts?"":(x.pts>y.pts?"lead-a":"lead-b");
        h+=`<div class="prow ${lead}">${cell(x)}<div class="slot">${esc(x.slot||"")}</div>${cell(y,true)}</div>`; }
      return h; };
    const sum = arr => arr.reduce((s,p)=>s+p.pts,0);
    const legend = Object.keys(POSC).map(k=>`<span><i style="background:${POSC[k]}"></i>${k}</span>`).join("");
    showDetail(
      `<button class="back" id="backBtn">‹ Back to Week ${leagues[li].week}</button>
       <div class="dhead">${head(m.a,!aLead)}<div class="dmid"><span class="vs">${m.status==="postevent"?"FINAL":"VS"}</span></div>${head(m.b,aLead)}</div>
       ${wp}
       <div class="legend">${legend}</div>
       <div class="lineup">
         <div class="secrow">Starters</div>
         ${rows(la.starters,lb.starters)}
         <div class="totrow"><div class="tc">${sum(la.starters).toFixed(1)}</div><div class="tm">TOTAL</div><div class="tc r">${sum(lb.starters).toFixed(1)}</div></div>
         <div class="secrow">Bench</div>
         ${rows(la.bench,lb.bench)}
       </div>`);
    $("#backBtn").onclick=hideDetail;
  }

  const root=document.documentElement, tb=$("#themeBtn");
  function applyTheme(t){ if(t)root.setAttribute("data-theme",t); else root.removeAttribute("data-theme");
    const dark=t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches); tb.textContent=dark?"☀️":"🌙"; }
  let saved=null; try{ saved=localStorage.getItem("ydub-theme"); }catch(e){}
  applyTheme(saved);
  tb.onclick=()=>{ const dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
    const n=dark?"light":"dark"; applyTheme(n); try{localStorage.setItem("ydub-theme",n);}catch(e){} };

  function dismissSplash(){ const s=$("#splash"); if(!s) return; s.classList.add("hide"); setTimeout(()=>s.remove(),540); }
  const splashStart=Date.now();
  loadAll().finally(()=>setTimeout(dismissSplash, Math.max(0, 1600-(Date.now()-splashStart))));
  setTimeout(dismissSplash, 6000);
  setInterval(()=>{ if($("#detail").hidden) loadAll(); }, 90000);
</script>
</body>
</html>
